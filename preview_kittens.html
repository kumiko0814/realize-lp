<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Yu Gothic","YuGothic","游ゴシック","Hiragino Kaku Gothic ProN",sans-serif;background:linear-gradient(180deg,#fdf4ec 0%,#fcf8f3 60%);color:#1a1a1a;min-height:100vh;padding:40px 20px;line-height:1.7}
.head{text-align:center;margin-bottom:32px}
.head .logo{font-family:"Cormorant Garamond",serif;font-size:24px;letter-spacing:0.3em;color:#c25b3f;font-weight:600}
.head h1{font-size:18px;margin-top:8px;letter-spacing:0.1em}
.head p{font-size:12px;color:#5a5a5a;margin-top:8px}
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#fff;border:1px solid #ece5d8;border-radius:18px;padding:18px 14px 18px;text-align:center}
.stage-num{display:inline-block;font-family:"Cormorant Garamond",serif;font-size:11px;letter-spacing:0.3em;color:#c25b3f;border:1px solid #c25b3f;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.arena{width:100%;height:200px;background:linear-gradient(180deg,#fefaf4 0%,#fbeede 100%);border:1px solid #f5eee2;border-radius:14px;position:relative;overflow:hidden;margin-bottom:10px}
.arena::after{content:"";position:absolute;left:10%;right:10%;bottom:14px;height:1px;background:linear-gradient(90deg,transparent,rgba(91,85,77,0.18) 20%,rgba(91,85,77,0.18) 80%,transparent)}
.walker{position:absolute;bottom:0;left:50%;width:190px;height:190px;margin-left:-95px}
.bouncer{width:100%;height:100%}
.walker svg{width:100%;height:100%;display:block}
.walker.walk{animation:walk 14s ease-in-out infinite}
.walker.walk .bouncer{animation:bounce 0.55s ease-in-out infinite}
.walker.bounce .bouncer{animation:bounce 0.7s ease-in-out infinite}
.walker.sway{animation:sway 4s ease-in-out infinite}
@keyframes walk{0%{transform:translateX(-28%) scaleX(1)}46%{transform:translateX(28%) scaleX(1)}50%{transform:translateX(28%) scaleX(-1)}96%{transform:translateX(-28%) scaleX(-1)}100%{transform:translateX(-28%) scaleX(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes pawL{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pawR{0%,100%{transform:translateY(-3px)}50%{transform:translateY(0)}}
.pc-paw-l{animation:pawL 0.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pc-paw-r{animation:pawR 0.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.name{font-size:14px;font-weight:700;letter-spacing:0.05em;margin-top:4px}
.cond{font-size:11px;color:#5a5a5a;letter-spacing:0.05em;margin-top:4px}
.foot{text-align:center;margin-top:30px;font-size:11px;color:#5a5a5a;letter-spacing:0.1em}
</style>
</head>
