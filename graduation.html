<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Re:alize ｜ 卒業証書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a1a;--sub:#5a5a5a;--mute:#8b8278;
  --accent:#c25b3f;--accent-deep:#a64626;
  --leaf:#7a9070;--leaf-deep:#5a7050;
  --pink:#e8b6bc;--pink-soft:#fce4e6;
  --gold:#c9a574;--gold-deep:#a67a26;
  --paper:#fdfaf3;--paper-deep:#f5ede2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Yu Mincho","游明朝","Yu Gothic","游ゴシック",serif;
  background:linear-gradient(135deg,#fff8ec 0%,#fce4e6 50%,#f0e8d8 100%);
  color:var(--ink);min-height:100vh;
  letter-spacing:0.06em;-webkit-font-smoothing:antialiased;
  font-feature-settings:"palt";
  overflow-x:hidden;
}
.sakura-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{
  position:absolute;font-size:20px;
  animation:petalFall linear infinite;
  opacity:0;
}
@keyframes petalFall{
  0%{transform:translateY(-60px) rotate(0deg);opacity:0}
  10%{opacity:0.7}
  90%{opacity:0.7}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

.wrap{max-width:780px;margin:0 auto;padding:60px 24px;position:relative;z-index:1}
@media(max-width:720px){.wrap{padding:32px 16px}}

/* CERTIFICATE FRAME */
.cert{
  background:
    radial-gradient(circle at 0% 0%,rgba(232,182,188,0.18) 0%,transparent 30%),
    radial-gradient(circle at 100% 100%,rgba(201,165,116,0.15) 0%,transparent 30%),
    linear-gradient(180deg,#fefaf2 0%,#fdf6e9 100%);
  border:1px solid var(--gold);
  border-radius:6px;
  padding:80px 56px 64px;
  position:relative;
  box-shadow:0 30px 80px rgba(166,122,38,0.18),0 10px 32px rgba(0,0,0,0.08);
}
.cert::before{
  content:"";
  position:absolute;inset:14px;
  border:1px solid rgba(201,165,116,0.55);
  border-radius:4px;pointer-events:none;
}
.cert::after{
  content:"";
  position:absolute;inset:24px;
  border:1px solid rgba(201,165,116,0.25);
  pointer-events:none;
}
@media(max-width:720px){.cert{padding:48px 24px 32px}}

/* CORNERS */
.cert-corner{position:absolute;width:32px;height:32px;color:var(--gold-deep);font-size:24px;opacity:0.6;line-height:1}
.cert-corner.tl{top:36px;left:40px}
.cert-corner.tr{top:36px;right:40px}
.cert-corner.bl{bottom:36px;left:40px}
.cert-corner.br{bottom:36px;right:40px}
@media(max-width:720px){.cert-corner{top:18px!important;bottom:18px!important;left:18px;right:18px}.cert-corner.tr,.cert-corner.br{left:auto;right:18px}}

/* HEADER */
.cert-header{text-align:center;margin-bottom:32px}
.cert-logo{
  font-family:"Cormorant Garamond",serif;font-size:18px;letter-spacing:0.45em;
  color:var(--leaf-deep);margin-bottom:18px;font-weight:500;
}
.cert-title-en{
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:14px;letter-spacing:0.45em;color:var(--gold-deep);
  margin-bottom:8px;
}
.cert-title{
  font-size:38px;font-weight:600;letter-spacing:0.32em;
  color:var(--ink);position:relative;display:inline-block;padding:0 28px;
}
.cert-title::before,.cert-title::after{
  content:"";position:absolute;top:50%;width:20px;height:1px;
  background:var(--gold);
}
.cert-title::before{left:-12px}
.cert-title::after{right:-12px}
@media(max-width:720px){.cert-title{font-size:26px;letter-spacing:0.2em}}

/* NAME */
.cert-name-wrap{text-align:center;margin:48px 0 40px;position:relative}
.cert-name-label{
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:11px;letter-spacing:0.35em;color:var(--mute);margin-bottom:14px;
}
.cert-name{
  font-size:36px;font-weight:500;letter-spacing:0.25em;
  color:var(--ink);padding-bottom:10px;
  border-bottom:1px solid var(--gold);
  display:inline-block;min-width:280px;
}
.cert-name-honor{font-size:18px;margin-left:10px;color:var(--mute);letter-spacing:0.15em}
@media(max-width:720px){.cert-name{font-size:26px;letter-spacing:0.15em;min-width:200px}}

/* BODY TEXT */
.cert-body{
  text-align:center;font-size:14.5px;line-height:2.4;
  color:var(--ink);letter-spacing:0.1em;margin:0 auto 40px;max-width:580px;
}
.cert-body .em{color:var(--leaf-deep);font-weight:600}
.cert-body .quote{
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:13px;color:var(--leaf-deep);letter-spacing:0.18em;
  display:block;margin-top:20px;
}

/* GOAL */
.cert-goal{
  background:rgba(255,255,255,0.55);
  border:1px solid rgba(201,165,116,0.4);
  border-radius:4px;padding:24px 28px;margin:0 auto 40px;
  max-width:560px;text-align:center;
}
.cert-goal-label{
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:11px;letter-spacing:0.32em;color:var(--gold-deep);margin-bottom:10px;
}
.cert-goal-text{font-size:16px;line-height:1.85;letter-spacing:0.08em;color:var(--ink);font-weight:500}

/* BADGES */
.cert-badges{margin:48px 0 40px}
.cert-badges-title{
  text-align:center;font-size:13px;letter-spacing:0.32em;
  color:var(--gold-deep);margin-bottom:8px;
  font-family:"Cormorant Garamond",serif;font-style:italic;
}
.cert-badges-sub{
  text-align:center;font-size:11px;color:var(--mute);letter-spacing:0.18em;margin-bottom:24px;
}
.cert-badge-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:10px;
  max-width:560px;margin:0 auto;
}
@media(max-width:720px){.cert-badge-grid{grid-template-columns:repeat(3,1fr);gap:6px}}
.cert-badge{text-align:center}
.cert-badge svg{width:64px;height:64px;display:block;margin:0 auto 4px}
.cert-badge .m{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:9px;letter-spacing:0.2em;color:var(--mute)}
.cert-badge .r{font-size:9px;color:var(--ink);letter-spacing:0.04em;margin-top:2px}

/* SUMMARY */
.cert-summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
  max-width:560px;margin:0 auto 48px;
}
@media(max-width:720px){.cert-summary{grid-template-columns:1fr;gap:10px}}
.cert-stat{
  background:rgba(255,255,255,0.6);
  border:1px solid rgba(201,165,116,0.3);
  border-radius:4px;padding:18px 14px;text-align:center;
}
.cert-stat-num{
  font-family:"Cormorant Garamond",serif;font-size:28px;
  color:var(--gold-deep);font-weight:600;line-height:1;
}
.cert-stat-unit{font-size:14px;color:var(--gold)}
.cert-stat-label{font-size:10px;color:var(--mute);letter-spacing:0.2em;margin-top:6px}

/* FOOTER (sign) */
.cert-foot{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-top:48px;padding-top:28px;border-top:1px solid rgba(201,165,116,0.3);
}
@media(max-width:720px){.cert-foot{flex-direction:column;gap:20px;align-items:center}}
.cert-date{font-size:12px;color:var(--mute);letter-spacing:0.2em}
.cert-date .y{font-family:"Cormorant Garamond",serif;font-size:18px;color:var(--ink);letter-spacing:0.08em;display:block;margin-bottom:4px}
.cert-stamp{
  width:90px;height:90px;border:2.5px solid var(--accent-deep);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;color:var(--accent-deep);transform:rotate(-12deg);
  background:rgba(255,255,255,0.4);
}
.cert-stamp::before{
  content:"";position:absolute;inset:5px;border:1px solid var(--accent-deep);border-radius:50%;
}
.cert-stamp-text{
  font-family:"Yu Mincho",serif;font-weight:700;font-size:11px;
  letter-spacing:0.15em;text-align:center;line-height:1.4;
}
.cert-stamp-text small{display:block;font-size:8px;letter-spacing:0.2em;margin-top:2px;font-weight:500}
.cert-sign{font-size:12px;color:var(--mute);letter-spacing:0.18em;text-align:center}
.cert-sign .name{font-family:"Yu Mincho",serif;font-size:16px;color:var(--ink);margin-bottom:4px;letter-spacing:0.12em}

/* ACTIONS */
.actions{text-align:center;margin-top:32px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{
  background:#fff;border:1px solid var(--gold);color:var(--gold-deep);
  font-family:"Yu Gothic",sans-serif;font-size:12px;font-weight:600;letter-spacing:0.2em;
  padding:14px 28px;border-radius:999px;cursor:pointer;
  transition:all 0.25s;text-decoration:none;display:inline-block;
}
.btn:hover{background:var(--gold);color:#fff}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-deep)}

@media print{
  body{background:#fff}
  .sakura-bg,.actions,.print-hide{display:none!important}
  .wrap{padding:0;max-width:none}
  .cert{box-shadow:none;border-color:var(--gold)}
}

/* empty state */
.empty{
  text-align:center;padding:80px 24px;
  font-size:14px;color:var(--sub);line-height:2.2;
}
.empty .em{color:var(--accent);font-weight:600}
</style>
</head>
<body>

<div class="sakura-bg" id="sakuraBg"></div>

<div class="wrap">
  <main id="certMain"></main>

  <div class="actions print-hide">
    <a href="#" class="btn" onclick="history.back();return false;">← マイページに戻る</a>
    <button class="btn primary" onclick="window.print()">🖨 印刷／PDF保存</button>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const userKey = params.get('u') || 'guest';
const storageKey = 're_alize_v2_' + userKey;
const TOTAL_WEEKS = 26;

function loadState(){
  const raw = localStorage.getItem(storageKey);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return null;
}

const RANKS = [
  { key:'gold',  label:'大変良くできました', fill:'#fef2c8', stroke:'#d4a574', glow:'#f5d77a' },
  { key:'pink',  label:'良くできました',     fill:'#fde0e7', stroke:'#d68aa0', glow:'#f0a6b8' },
  { key:'light', label:'頑張りました',       fill:'#fdeef0', stroke:'#e8b6bc', glow:'#fde0e7' },
  { key:'white', label:'頑張りましょう',     fill:'#ffffff', stroke:'#d8c8c5', glow:'#f5eee2' }
];
function getRank(key){ return RANKS.find(r=>r.key===key) || RANKS[3]; }

function buildBadgeSVG(rank, month){
  const petals = [0,72,144,216,288].map(deg => `
    <g transform="rotate(${deg} 100 100)">
      <path d="M 100 100 C 86 76 86 36 100 22 C 114 36 114 76 100 100 Z"
        fill="${rank.fill}" stroke="${rank.stroke}" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
  `).join('');
  return `
    <svg viewBox="0 0 200 200">
      ${petals}
      <circle cx="100" cy="100" r="32" fill="${rank.fill}" stroke="${rank.stroke}" stroke-width="1.5"/>
      <text x="100" y="98" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="14" fill="#8a4a3a" font-weight="600">${month}</text>
      <text x="100" y="116" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="7" fill="#8a4a3a" letter-spacing="1">MONTH</text>
    </svg>
  `;
}

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 桜の花びら背景
function initSakura(){
  const bg = document.getElementById('sakuraBg');
  const emojis = ['🌸','🌷','🌸','🌸'];
  for(let i = 0; i < 18; i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = emojis[i % emojis.length];
    p.style.left = (Math.random()*100) + '%';
    p.style.animationDuration = (8 + Math.random()*8) + 's';
    p.style.animationDelay = (Math.random()*-10) + 's';
    p.style.fontSize = (14 + Math.random()*16) + 'px';
    bg.appendChild(p);
  }
}
initSakura();

const state = loadState();
const main = document.getElementById('certMain');

if(!state || !state.badges || Object.keys(state.badges).length === 0){
  main.innerHTML = `
    <div class="empty">
      <div style="font-size:48px;margin-bottom:16px">🌸</div>
      <p>まだ卒業証書を準備できていません。</p>
      <p>毎月のバッジを集めると、ここに <span class="em">あなただけの卒業証書</span> が現れます。</p>
      <div style="margin-top:32px">
        <a href="dashboard.html?u=${encodeURIComponent(userKey)}" class="btn">マイページへ</a>
      </div>
    </div>
  `;
} else {
  renderCertificate();
}

function renderCertificate(){
  const userName = state.userName || 'あなた';
  const goal = state.goal || '半年間の挑戦';
  const badges = state.badges || {};

  // 集計
  let totalSum = 0, totalCha = 0, monthCount = 0;
  let goldCount = 0;
  for(let m = 1; m <= 6; m++){
    const b = badges[m];
    if(!b) continue;
    monthCount++;
    if(b.rankKey === 'gold') goldCount++;
    if(b.snapshot && b.snapshot.krs){
      b.snapshot.krs.forEach(kr => kr.subs.forEach(s => {
        totalSum += parseFloat(s.monthSum) || 0;
        totalCha += (s.cha || 0) / 6;
      }));
    }
  }
  const finalRatio = totalCha > 0 ? Math.round(totalSum / totalCha * 100) : 0;

  // バッジHTML
  const badgesHtml = [1,2,3,4,5,6].map(m => {
    const b = badges[m];
    if(!b) return `<div class="cert-badge"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="40" fill="none" stroke="#d8c8c5" stroke-width="2" stroke-dasharray="4,4"/></svg><div class="m">Month ${m}</div><div class="r" style="color:#b0a698">—</div></div>`;
    const rank = getRank(b.rankKey);
    return `<div class="cert-badge">${buildBadgeSVG(rank, m)}<div class="m">Month ${m}</div><div class="r">${rank.label}</div></div>`;
  }).join('');

  // 主要KR
  const lastBadge = badges[6] || badges[5] || badges[4] || badges[3] || badges[2] || badges[1];
  const krList = (lastBadge && lastBadge.snapshot) ? lastBadge.snapshot.krs.flatMap(kr => kr.subs.map(s => s.name).filter(Boolean)).slice(0,3) : [];

  // 日付
  const today = new Date();
  const dateStr = `${today.getFullYear()}年 ${today.getMonth()+1}月 ${today.getDate()}日`;
  const dateEn = today.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});

  main.innerHTML = `
    <section class="cert">
      <div class="cert-corner tl">🌸</div>
      <div class="cert-corner tr">🌸</div>
      <div class="cert-corner bl">🌸</div>
      <div class="cert-corner br">🌸</div>

      <div class="cert-header">
        <div class="cert-logo">Re:alize</div>
        <div class="cert-title-en">— Certificate of Completion —</div>
        <h1 class="cert-title">卒業証書</h1>
      </div>

      <div class="cert-name-wrap">
        <div class="cert-name-label">— BESTOWED UPON —</div>
        <div>
          <span class="cert-name">${escapeHtml(userName)}</span>
          <span class="cert-name-honor">様</span>
        </div>
      </div>

      <div class="cert-body">
        あなたは Re:alize に <span class="em">半年間</span> 参加し、<br>
        ご自身で定めた目標と向き合い続け、<br>
        ここに <span class="em">6つのマンスリーバッジ</span> を獲得されました。<br>
        <br>
        その歩みと姿勢は、何よりも価値のあるものです。<br>
        ここに、あなたの半年間の挑戦を讃え、本証書を授与します。
        <span class="quote">— Six months. Reborn. —</span>
      </div>

      <div class="cert-goal">
        <div class="cert-goal-label">— YOUR GOAL —</div>
        <div class="cert-goal-text">${escapeHtml(goal)}</div>
      </div>

      ${krList.length > 0 ? `
      <div class="cert-goal" style="margin-top:-20px">
        <div class="cert-goal-label">— KEY RESULTS —</div>
        <div class="cert-goal-text" style="font-size:13px;line-height:2;font-weight:400">
          ${krList.map(n => `「${escapeHtml(n)}」`).join('　')}
        </div>
      </div>
      ` : ''}

      <div class="cert-badges">
        <div class="cert-badges-title">— SIX SAKURA BADGES —</div>
        <div class="cert-badges-sub">毎月の歩み、ひとつずつの証</div>
        <div class="cert-badge-grid">${badgesHtml}</div>
      </div>

      <div class="cert-summary">
        <div class="cert-stat">
          <div><span class="cert-stat-num">${monthCount}</span><span class="cert-stat-unit"> / 6</span></div>
          <div class="cert-stat-label">獲得バッジ数</div>
        </div>
        <div class="cert-stat">
          <div><span class="cert-stat-num">${goldCount}</span><span class="cert-stat-unit"> 月</span></div>
          <div class="cert-stat-label">最高ランク</div>
        </div>
        <div class="cert-stat">
          <div><span class="cert-stat-num">${finalRatio}</span><span class="cert-stat-unit">%</span></div>
          <div class="cert-stat-label">平均 CHA 達成率</div>
        </div>
      </div>

      <div class="cert-foot">
        <div class="cert-date">
          <span class="y">${dateEn}</span>
          ${dateStr}
        </div>
        <div class="cert-stamp">
          <div class="cert-stamp-text">Re:alize<small>MERONE INC.</small></div>
        </div>
        <div class="cert-sign">
          <div class="name">清水 翔</div>
          Re:alize 主宰 ／ Merone Inc.
        </div>
      </div>
    </section>
  `;
}
</script>

</body>
</html>
